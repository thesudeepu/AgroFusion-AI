 { i:"🛡️", n:"Fruit Quality Grading", d:"Upload a fruit photo to get its grade.", img:["Grade A","Grade B","Grade C","Rejected"] },

 { i:"🐛", n:"Pest Detection", d:"Upload a leaf photo to detect pests.", img:["Healthy","Aphids","Caterpillar","Armyworm"] },
 { i:"📈", n:"Agricultural Price Prediction", d:"Predict the next market price.",
   f:[crop, num("p","Current price (Rs/quintal)",2200), num("r","Rainfall index (0-100)",50)],
   fn:v => { const p=Math.round(v.p*(1+(v.r-50)/400));
     return [L("Rs")+" "+p+" / "+L("quintal"), L(p>v.p?"Price may go up.":"Price may go down."), 60]; } },
 { i:"💰", n:"Farm Profit Prediction", d:"Estimate your profit before you sow.",
   f:[num("a","Land (acres)",2), num("c","Cost (Rs/acre)",25000), num("y","Yield (quintal/acre)",18), num("p","Price (Rs/quintal)",2200)],
   fn:v => { const pr=v.a*(v.y*v.p-v.c);
     return [L("Rs")+" "+pr.toLocaleString("en-IN"), L(pr>0?"You can expect a profit.":"Loss possible. Reduce cost."), Math.max(5,Math.min(100,pr/v.a/400))]; } },
 { i:"🚿", n:"Crop Water Requirement Prediction", d:"Find total water needed for your land.",
   f:[crop, num("a","Land (acres)",1), num("d","Crop age (days)",60)],
   fn:v => { const Lt=Math.round(WAT[v.crop]*4046*v.a*(v.d>20?1:.5));
     return [Lt.toLocaleString("en-IN")+" "+L("litres/day"), L("Calculated for the crop stage."), Math.min(100,Lt/800)]; } },
 { i:"🧪", n:"Smart Fertilizer Recommendation", d:"Get the right fertilizer for your soil.",
   f:[num("N","Nitrogen (N)",40), num("P","Phosphorus (P)",30), num("K","Potassium (K)",30)],
   fn:v => { const m=Math.min(v.N,v.P,v.K);
     const r=m===v.N?"Urea":m===v.P?"DAP / SSP":"Muriate of Potash";
     return [L(r), L("Your soil is lowest in this nutrient."), 100-m]; } },
 { i:"🥀", n:"Crop Stress Detection", d:"Upload a leaf photo to detect stress.", img:["No stress","Water stress","Nutrient deficiency","Disease signs"] },
 { i:"🌰", n:"Seed Quality Classification", d:"Upload a seed photo to check quality.", img:["Good seed","Average","Bad seed"] },
 { i:"🌱", n:"Plant Growth Prediction", d:"Predict plant height at a given age.",
   f:[crop, num("d","Days",40)],
   fn:v => { const h=Math.round(160/(1+Math.exp(-(v.d-DUR[v.crop]/2)/(DUR[v.crop]/8))));
     return [h+" "+L("cm"), L("Estimated plant height."), Math.min(100,h/1.6)]; } },
 { i:"♻️", n:"Agricultural Waste Classification", d:"Upload a photo of farm waste to sort it.", img:["Compostable","Animal fodder","Biofuel","Not reusable"] },
 { i:"🌽", n:"Crop Recommendation", d:"Find the best crop for your soil and rainfall.",
   f:[num("N","Nitrogen (N)",60), num("P","Phosphorus (P)",40), num("K","Potassium (K)",40), num("ph","Soil pH",6.5), num("r","Rainfall (mm)",800)],
   fn:v => { const c=v.r>1100?"Rice":v.r>800?"Sugarcane":v.r>600?"Maize":v.r>400?"Ragi":"Jowar";
     return [L(c), L("Best crop for your soil and rainfall."), 82]; } }
];

const id = parseInt(new URLSearchParams(location.search).get("id")) || 0;
const t = T[id];
const box = document.getElementById("box");
const out = document.getElementById("out");

let saved = {};
let imgSrc = null, imgSize = 0;
let lastCall = null;

function show(r) {
  out.innerHTML = `<div class="result"><div class="rbig">${r[0]}</div><p>${r[1]}</p>
    <div class="bar"><i style="width:${r[2]}%"></i></div>
    <small>${L("Demo result. A real AI model will be connected later.")}</small></div>`;
}

function snap() {
  saved = {};
  if (t.f) t.f.forEach(f => {
    const e = document.getElementById("f_" + f.k);
    if (e) saved[f.k] = e.value;
  });
}

function render() {
  document.getElementById("ico").textContent = t.i;
  document.getElementById("title").textContent = (id + 1) + ". " + L(t.n);
  document.getElementById("desc").textContent = L(t.d);
  document.title = t.n + " - AgroFusion AI";

  if (t.img) {
    box.innerHTML = `<label class="drop" id="dz"><span id="dzc">${imgSrc ? `<img src="${imgSrc}">` : L("📷 Click to upload a photo")}</span>
      <input type="file" accept="image/*" id="file" hidden></label>
      <button class="btn green big" id="go">${L("Analyze")}</button>`;
    document.getElementById("file").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      imgSize = f.size;
      const r = new FileReader();
      r.onload = ev => {
        imgSrc = ev.target.result;
        document.getElementById("dzc").innerHTML = `<img src="${imgSrc}">`;
      };
      r.readAsDataURL(f);
    };
    document.getElementById("go").onclick = () => {
      if (!imgSize) { lastCall = null; out.innerHTML = `<div class="result">${L("Please upload a photo first.")}</div>`; return; }
      const cls = t.img[imgSize % t.img.length], p = 70 + imgSize % 26;
      lastCall = () => [L(cls), L("AI confidence") + ": " + p + "%", p];
      show(lastCall());
    };
  } else {
    box.innerHTML = `<div class="form">` + t.f.map(f => {
      const val = saved[f.k] !== undefined ? saved[f.k] : f.d;
      return `<div><label>${L(f.l)}</label>` + (f.t === "sel"
        ? `<select id="f_${f.k}">${CROPS.map(c => `<option value="${c}"${saved[f.k] === c ? " selected" : ""}>${L(c)}</option>`).join("")}</select>`
        : `<input id="f_${f.k}" type="number" step="any" value="${val}">`) + `</div>`;
    }).join("") + `</div><button class="btn green big" id="go">${L("Get Result")}</button>`;
    document.getElementById("go").onclick = () => {
      const v = {};
      t.f.forEach(f => { const e = document.getElementById("f_" + f.k); v[f.k] = f.t === "sel" ? e.value : parseFloat(e.value) || 0; });
      lastCall = () => t.fn(v);
      show(lastCall());
    };
  }
}

render();

/* re-draw this page when the language is changed */
const langSel = document.getElementById("langSel");
if (langSel) {
  langSel.addEventListener("change", () => {
    lang = langSel.value;
    snap();
    render();
    if (lastCall) show(lastCall());
  });
}
</script>
